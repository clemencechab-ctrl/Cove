name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_ID: covestudio
  REGION: europe-west1
  SERVICE: cove-api

jobs:
  deploy:
    name: Deploy Firebase + Cloud Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authentification Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Générer le fichier env vars pour Cloud Run
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_B64 }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
        run: |
          python3 - <<'PYEOF'
          import os, yaml
          env = {
              'NODE_ENV': 'production',
              'FRONTEND_URL': 'https://covestudio.fr',
              'FIREBASE_DATABASE_URL': os.environ.get('FIREBASE_DATABASE_URL', ''),
              'FIREBASE_SERVICE_ACCOUNT': os.environ.get('FIREBASE_SERVICE_ACCOUNT_B64', ''),
              'FIREBASE_API_KEY': os.environ.get('FIREBASE_API_KEY', ''),
              'EMAIL_HOST': 'smtp.gmail.com',
              'EMAIL_PORT': '587',
              'EMAIL_USER': os.environ.get('EMAIL_USER', ''),
              'EMAIL_PASS': os.environ.get('EMAIL_PASS', ''),
              'EMAIL_FROM': os.environ.get('EMAIL_USER', ''),
              'OWNER_EMAIL': os.environ.get('OWNER_EMAIL', ''),
              'STRIPE_SECRET_KEY': os.environ.get('STRIPE_SECRET_KEY', ''),
              'STRIPE_WEBHOOK_SECRET': os.environ.get('STRIPE_WEBHOOK_SECRET', ''),
          }
          with open('backend/.env-cloudrun.yaml', 'w') as f:
              yaml.dump(env, f, default_flow_style=False)
          print('Env vars file generated with keys:', list(env.keys()))
          PYEOF

      - name: Deploy backend sur Cloud Run
        working-directory: backend
        run: |
          gcloud run deploy $SERVICE \
            --source . \
            --region $REGION \
            --project $PROJECT_ID \
            --env-vars-file .env-cloudrun.yaml \
            --memory 512Mi \
            --max-instances 10 \
            --allow-unauthenticated \
            --quiet

      # continue-on-error : le déploiement Hosting est souvent fait manuellement
      # (tests/deploy-hosting.js) AVANT le push. Quand Actions arrive, la version
      # identique est déjà en ligne et Firebase renvoie une 400 « supplied version
      # is the current active version ». C'est un no-op inoffensif, pas un vrai
      # échec — on ne veut donc pas faire échouer le job (ni envoyer un mail d'alerte).
      # Le backend Cloud Run, lui, est déployé à l'étape précédente (bloquante).
      - name: Deploy frontend sur Firebase Hosting
        continue-on-error: true
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.GCP_SA_KEY }}
          projectId: ${{ env.PROJECT_ID }}
          channelId: live
